name: Материалы курса

on:
  push:
    paths:
      - "course/**"
      - "slides/**"
      - "solutions/**"
      - "tools/**"
      - "templates/**"
      - "scripts/**"
      - "course.yml"
      - "plan.yml"
      - "ktp.yml"
      - "sources.yml"
      - ".github/workflows/materials.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Установка coursekit
        run: pip install -e "tools[dev]"

      - name: Тесты coursekit
        run: PYTHONPATH=tools pytest tools/coursekit/tests -q

      - name: Заголовки приведены к стандарту
        run: PYTHONPATH=tools python -m coursekit normalize --check

      - name: План согласован с файлами
        run: PYTHONPATH=tools python -m coursekit plan --check

      - name: Проверка корпуса
        run: PYTHONPATH=tools python -m coursekit qa

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: typst-community/setup-typst@v3

      - name: Установка pandoc
        run: |
          curl -fsSL https://github.com/jgm/pandoc/releases/download/3.1.3/pandoc-3.1.3-linux-amd64.tar.gz -o /tmp/pandoc.tar.gz
          sudo tar -xzf /tmp/pandoc.tar.gz -C /usr/local --strip-components=1
          pandoc --version | head -1

      - name: Установка coursekit
        run: pip install -e "tools[dev]"

      - name: Сборка
        run: python -m coursekit build --book

      - name: Публикация артефактов
        uses: actions/upload-artifact@v4
        with:
          name: materials
          path: dist/
          if-no-files-found: error
